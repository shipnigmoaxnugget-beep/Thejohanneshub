/* ===================== */
/* PIN SCREEN            */
/* ===================== */

#pinScreen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#0f0f0f;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

}

#pinScreen h2{

margin-bottom:8px;
color:#ff6b6b;

}

#pinScreen p{
font-size:13px;
color:#888;
margin-bottom:30px;
}

.pin-dots{
display:flex;
gap:14px;
margin-bottom:30px;
}

.dot{
width:18px;height:18px;
border-radius:50%;
border:2px solid #ff6b6b;
background:transparent;
transition:background 0.15s;
}

.dot.filled{
background:#ff6b6b;
}

.pin-grid{
display:grid;
grid-template-columns:repeat(3,80px);
gap:12px;
}

.pin-btn{
height:60px;
background:#1a1a1a;
border:1px solid #333;
color:white;
font-size:22px;
border-radius:10px;
cursor:pointer;
transition:0.15s;
}

.pin-btn:hover{
background:#2a2a2a;
border-color:#ff6b6b;
}

.pin-btn:active{
transform:scale(0.94);
}

.pin-btn.del{
font-size:16px;
color:#ff6b6b;
}

#pinError{
margin-top:18px;
color:#ff4444;
font-size:14px;
min-height:20px;
}

/* SHAKE ANIMATION */
@keyframes shake{
0%{transform:translateX(0)}
20%{transform:translateX(-8px)}
40%{transform:translateX(8px)}
60%{transform:translateX(-6px)}
80%{transform:translateX(6px)}
100%{transform:translateX(0)}
}

.shake{
animation:shake 0.4s ease;
}

const CORRECT_PIN = "69420"; // <-- HIER deinen Code ändern
let currentPin = "";

function pinPress(num){
  if(currentPin.length >= 5) return;
  currentPin += num;
  updateDots();
  if(currentPin.length === 5){
    setTimeout(checkPin, 150);
  }
}

function pinDel(){
  currentPin = currentPin.slice(0,-1);
  updateDots();
  document.getElementById("pinError").textContent = "";
}

function pinClear(){
  currentPin = "";
  updateDots();
  document.getElementById("pinError").textContent = "";
}

function updateDots(){
  for(let i=0;i<5;i++){
    document.getElementById("d"+i).classList.toggle("filled", i < currentPin.length);
  }
}

function checkPin(){
  if(currentPin === CORRECT_PIN){
    document.getElementById("pinScreen").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
  } else {
    document.getElementById("pinError").textContent = "❌ Falscher Code!";
    document.getElementById("pinDots").classList.add("shake");
    setTimeout(()=>{
      document.getElementById("pinDots").classList.remove("shake");
    }, 400);
    currentPin = "";
    updateDots();
  }
}

// Tastatur-Support
document.addEventListener("keydown", e => {
  if(e.key >= "0" && e.key <= "9") pinPress(e.key);
  if(e.key === "Backspace") pinDel();
  if(e.key === "Escape") pinClear();
});

  function openGame(url, type) {
